worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream backend_pool {
        server 172.20.10.3:3001 max_fails=1 fail_timeout=5s;
        server 172.20.10.3:3002 max_fails=1 fail_timeout=5s;
    }

    server {
        listen 8443 ssl;
        server_name app.team1.test;

        ssl_certificate /opt/homebrew/etc/nginx/certs/server.crt;
        ssl_certificate_key /opt/homebrew/etc/nginx/certs/server.key;

        location / {
            proxy_pass http://backend_pool;

            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 5s;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
